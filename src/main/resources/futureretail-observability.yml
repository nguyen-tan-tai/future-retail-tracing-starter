management:
   tracing:
      sampling:
         probability: 1.0
   metrics:
      enable:
         all: false
   endpoints:
      web:
         exposure:
            include: health,info

logging:
   level:
      root: INFO
   pattern:
      correlation: '[${spring.application.name:},%X{traceId:-},%X{spanId:-}] '
      level: '%5p [traceId=%X{traceId:-} spanId=%X{spanId:-}]'